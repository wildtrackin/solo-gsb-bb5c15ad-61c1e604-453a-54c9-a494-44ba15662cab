<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTTP 路由冲突实验室</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⇄</span>
      <div>
        <h1>HTTP 路由冲突实验室</h1>
        <p class="subtitle">按优先级编辑路由规则，实时判定<strong>完全遮蔽</strong>与<strong>部分重叠</strong>，拖动行可调整顺序</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-add" class="btn" type="button">＋ 新增规则</button>
      <button id="btn-import" class="btn" type="button">导入 JSON</button>
      <button id="btn-export" class="btn btn-primary" type="button">导出 JSON</button>
      <button id="btn-reset" class="btn btn-ghost" type="button">重置示例</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="layout">
    <section class="panel rules-panel">
      <div class="panel-head">
        <h2>路由规则 <span class="hint">（自上而下即匹配优先级，⣿ 拖动排序）</span></h2>
        <div class="legend">
          <span class="dot dot-shadow"></span> 涉及遮蔽
          <span class="dot dot-partial"></span> 仅重叠
          <span class="dot dot-invalid"></span> 语法错误
        </div>
      </div>
      <div class="table-head-row">
        <span class="col-grip"></span>
        <span class="col-idx">#</span>
        <span class="col-method">方法</span>
        <span class="col-path">路径模式</span>
        <span class="col-status">状态</span>
        <span class="col-del"></span>
      </div>
      <ol id="rules-list" class="rules-list"></ol>
      <p class="syntax-help">
        语法：<code>/static</code> 静态段 · <code>/:param</code> 参数（匹配一个非空段） · <code>/*</code> 通配符（匹配零或多个段）。
        方法 <code>ALL</code> 表示与任意方法比较。
      </p>
    </section>

    <section class="panel result-panel">
      <div class="panel-head">
        <h2>冲突分析结果</h2>
        <div id="summary" class="summary"></div>
      </div>
      <div id="fix-plan"></div>
      <div id="conflicts" class="conflicts"></div>
      <div id="toast" class="toast" hidden></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
